<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>view Students</title>
</head>
<body onload="fillPage()">
    <nav>
        <a href="dashboard.html">Home</a>
        <a href="addStudents.html">add-students</a>
        <a href="viewStudents.html">view-students</a>
        <a href="logout.html">logout</a>

    <h1>View Students</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Branch</th>
                <th>Year</th>
                <th>CGPA</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    <script>
        async function fillPage(){
            const tbody=document.getElementsByTagName("tbody")[0];
            const api=await fetch("http://localhost:3000/students",{
                method:"GET"
            });
            const dbase= await api.json();
            // console.log(dbase);
            for(let obj of dbase){
                // if(obj.display){
                    let trow=document.createElement("tr");

                    trow.innerHTML=`<td>${obj.sname}</td>
                                    <td>${obj.roll}</td>
                                    <td>${obj.branch}</td>
                                    <td>${obj.year}</td>
                                    <td>${obj.cgpa}</td>
                                    <td><a href="modifyDetails.html?id=${obj.id}">Edit</a> / <a href="#" onclick="deleteStudent('${obj.id}'); return false;">Delete</a></td>`;
                    tbody.appendChild(trow);
                // }
            }
        }

            // dbase = dbase.filter(student => student.roll != roll);
            // localStorage.setItem('students', JSON.stringify(dbase));
            // location.reload();
            // const api=await fetch("http://localhost:3000/students",{
            //     method:"GET"
            // });
            
            // const list=await api.json();
            // console.log(list);
            // let idx=list.findIndex((obj)=>obj.roll==roll);
            
            // let id=list[idx].id;

            // console.log(id);

            await fetch(`http://localhost:3000/students/${id}`,{
                method:'DELETE'
            })
            location.reload();
        }
    </script>
</body>
</html>
