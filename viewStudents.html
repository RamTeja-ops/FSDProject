<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>view Students</title>
</head>
<body>
    <nav>
        <a href="dashboard.html">Home</a>
        <a href="addStudents.html">add-students</a>
        <a href="viewStudents.html">view-students</a>
        <a href="logout.html">logout</a>
    </nav>
    <h1>View Students</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Branch</th>
                <th>Year</th>
                <th>CGPA</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    <script>
        let tbody=document.getElementsByTagName("tbody")[0];
        let dbase=JSON.parse(localStorage.getItem('students')) || [];

        for(let obj of dbase){
            let trow=document.createElement("tr");

            trow.innerHTML=`<td>${obj.sname}</td>
                            <td>${obj.roll}</td>
                            <td>${obj.branch}</td>
                            <td>${obj.year}</td>
                            <td>${obj.cgpa}</td>
                            <td><a href="modifyDetails.html?roll=${obj.roll}">Edit</a> / <a href="#" onclick="deleteStudent('${obj.roll}'); return false;">Delete</a></td>`;
            tbody.appendChild(trow);
        }

        function deleteStudent(roll){
            let dbase=JSON.parse(localStorage.getItem('students')) || [];
            dbase = dbase.filter(student => student.roll != roll);
            localStorage.setItem('students', JSON.stringify(dbase));
            location.reload();
        }
    </script>
</body>
</html>
