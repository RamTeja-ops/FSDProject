<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Add Students</title>
    <script>
        async function addStud(event){
            event.preventDefault();
            let sname=document.getElementById("studentName").value;
            let roll=document.getElementById("rollNumber").value;
            let branch=document.getElementById("branch").value;
            let year=document.getElementById("year").value;
            let cgpa=document.getElementById("CGPA").value;

            let obj={
                sname:sname,
                roll:roll,
                branch:branch,
                year:year,
                cgpa:cgpa
                // display:true
            };

            const api=await fetch("http://localhost:5000/api/addStudents",{
                method:"POST",
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(obj)
            });

            const result = await api.json();

            console.log(result);

            window.location.href="/students";
        }
    </script>
</head>
<body>
    <nav>
        <a href="/dashboard">Home</a>
        <a href="/addStudent">add-students</a>
        <a href="/students">view-students</a>
        <a href="/logout">logout</a>
    </nav>
    <h1>Add Student</h1>
    <form onsubmit="addStud(event)">
        <label for="studentName">Name:</label>
        <input type="text" id="studentName" name="studentName" required>
        <br><br>
        <label for="rollNumber">RollNumber:</label>
        <input type="text" id="rollNumber" name="rollNumber" required>
        <br><br>
        <label for="branch">Branch:</label>
        <input type="text" id="branch" name="branch" required>
        <br><br>
        <label for="year">Year</label>
        <input type="number" id="year" name="year" min="1" max="4" required>
        <br><br>
        <label for="CGPA" >CGPA:</label>
        <input type="number" id="CGPA" name="CGPA" step="0.1" min="0" max="10" required>
        <br><br>
        <button type="submit">Add Student</button>
    </form>
</body>
</html>
