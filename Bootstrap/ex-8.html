<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <button class="btn m-2 btn-primary">Blue Button</button>
            <button class="btn m-2 btn-secondary">Gray Button</button>
            <button class="btn m-2 btn-outline-warning">Outlined Button</button>
            <button class="btn m-2 rounded-circle btn-outline-dark" style="width: 150px;">Rounded Circle Button</button>
            <button class="btn m-2 rounded-pill btn-info" style="width:250px">button 1</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
