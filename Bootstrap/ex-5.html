<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alignment And Reordering</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-3 text-dark bg-primary">Center 1</div>
            <div class="col-sm-8 text-warning bg-secondary">Center 2</div>
        </div>
        <div class="row align-items-center">
            <div class="col-md-12 text-warning bg-dark">Center 3</div>
        </div>
    </div>
    <h1 class="text-center">Ordering Items Check</h1>
    <div class="container">
        <div class="row text-center">
            <div class="col-md-4 order-md-3 bg-primary">Item1</div>
            <div class="col-md-4  order-md-2 bg-secondary">Item2</div>
            <div class="col-md-4 order-md-1 bg-warning">Item3</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
