<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="display-1">Exercise-7.1</div>
    <div class="container">
        <div class="row">
            <div class="display-1">DISPLAY 1</div>
            <div class="lead">LEAD</div>
            <div class="text-muted">TEXT-MUTED</div>
            <div class="fw-bold">BOLDED TEXT</div>
        </div>
    </div>
    <div class="display-1">Exercise-7.2</div>
    <div class="container">
        <div class="row">
            <div class="text-uppercase">uppercase</div>
            <div class="text-lowercase">LOWERCASE</div>
            <div class="text-capitalize">text capitalize</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
