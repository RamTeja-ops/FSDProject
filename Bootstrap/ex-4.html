<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentals Of Responsive Grid Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <h1 class="text-uppercase">TWO COLUMN LAYOUT</h1>
    <div class="container">
        <div class="row text-center">
            <div class="col-md-3 bg-primary">Sidebar</div>
            <div class="col-md-9 bg-secondary">Content Area</div>
        </div>
    </div>
    <h1 class="text-uppercase">FOUR COLUMN LAYOUT</h1>
    <div class="container">
        <div class="row text-center">
            <div class="col-sm-3 px-3 bg-primary">Item1</div>
            <div class="col-sm-3 px-3 bg-secondary">Item2</div>
            <div class="col-sm-3 px-3 bg-info">Item3</div>
            <div class="col-sm-3 px-3 bg-dark text-white">Item4</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
