<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Register</title>
    <script>
        async function registerUser(event){
            console.log("Event button clicked");
            event.preventDefault();
            let uname=document.getElementById("username").value;
            let pwd=document.getElementById("password").value;
            let mail=document.getElementById("email").value;
            let confirmPwd=document.getElementById("confirm_password").value;

            let unameRegEx=/^\w{6}/;
            if(!unameRegEx.test(uname)){
                window.alert(`username should be minimum of 6 characters long and shouldn't contain special characters`);
                return;
            }
            
            let emailRegEx=/^\w{4,}(@)[a-z]{1,8}\.(com)$/
            if(!emailRegEx.test(mail)){
                window.alert(`Email entered is not following `);
                return;
            }
            
            let password=/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$&*]).{8,12}$/
            
            if(!password.test(pwd)){
                window.alert(`password should contains atleast one lowercase,one uppercase,one numeric and one special character`);
                return;
            }

            if(pwd!=confirmPwd){
                window.alert(`Password and confirm password are not matching`);
                return;
            }

            const userDetails={
                name:uname,
                email:mail,
                password:pwd
            };
            
            // localStorage.setItem(uname,JSON.stringify(userDetails));
            // window.location.href="login.html";
            // fetch("http://localhost:3000/users",{
            //     method:"POST",
            //     headers:{'Content-Type':'application/json'},
            //     body:JSON.stringify(userDetails)
            // });
            let response;
            try{
                console.log("before fetch");
                response=await fetch("http://localhost:5000/api/register",{
                    method:"POST",
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify(userDetails)
                });
                
                console.log("After Fetch");
            }
            catch(err){
                console.log("Fetch Error : ",err);
            }

            const result=await response.json();

            if(result.success){
                alert("Registration successfull")
                window.location.href="/login";
            }
            else{
                alert(result.message);
            }
        }
    </script>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/signup">Register</a>
    </nav>
    <br><br>
    <h2>Create Your Account</h2>
    <form onsubmit="registerUser(event)">
        <label>Username</label>
        <input type="text" name="username" id="username" placeholder="Username" required>
        <br>
        <label>Email</label>
        <input type="text" name="email" id="email" placeholder="Email" required>
        <br>
        <label>Password</label>
        <input type="password" name="password" id="password" placeholder="Password" required>
        <br>
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
        <br>
        <p>Already have an account? <a href="/login">Login</a></p>
        <br>
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
